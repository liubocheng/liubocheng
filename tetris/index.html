<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俄罗斯方块</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
            margin: 0;
            font-family: 'Arial', sans-serif;
        }

        #game-container {
            display: flex;
            gap: 30px;
            background: #2d2d2d;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        canvas {
            border: 2px solid #3d3d3d;
            border-radius: 5px;
        }

        #info-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            color: #fff;
        }

        .score-box {
            background: #3d3d3d;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
        }

        #next-piece {
            width: 120px;
            height: 120px;
        }

        button {
            background: #4CAF50;
            border: none;
            padding: 10px 20px;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="300" height="600"></canvas>
        <div id="info-panel">
            <div class="score-box">
                <h2>得分</h2>
                <div id="score">0</div>
            </div>
            <div class="score-box">
                <h2>最高分</h2>
                <div id="high-score">0</div>
            </div>
            <canvas id="next-piece" width="120" height="120"></canvas>
            <button id="pause-btn">暂停/继续</button>
            <button id="restart-btn" style="background:#e74c3c">重新开始</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const nextPieceCanvas = document.getElementById('next-piece');
        const nextCtx = nextPieceCanvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('high-score');
        const pauseBtn = document.getElementById('pause-btn');
        const restartBtn = document.getElementById('restart-btn');

        const BLOCK_SIZE = 30;
        const COLS = 10;
        const ROWS = 20;
        const SHAPES = [
            [[1,1,1,1]],                         // I
            [[1,1,1],[0,1,0]],                   // T
            [[1,1,1],[1,0,0]],                   // L
            [[1,1,1],[0,0,1]],                   // J
            [[1,1],[1,1]],                       // O
            [[1,1,0],[0,1,1]],                   // S
            [[0,1,1],[1,1,0]]                    // Z
        ];
        const COLORS = ['#00f0f0', '#f0a000', '#f0f000', '#a000f0', '#f00000', '#00f000', '#0000f0'];

        let board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
        let currentPiece = null;
        let nextPiece = null;
        let score = 0;
        let highScore = localStorage.getItem('tetrisHighScore') || 0;
        let gameLoop;
        let isPaused = false;

        highScoreElement.textContent = highScore;

        function initGame() {
            createNewPiece();
            drawNextPiece();
            gameLoop = setInterval(update, 1000);
        }

        function createNewPiece() {
            currentPiece = nextPiece || {
                shape: SHAPES[Math.floor(Math.random() * SHAPES.length)],
                color: COLORS[Math.floor(Math.random() * COLORS.length)],
                x: Math.floor(COLS/2) - 2,
                y: 0
            };
            
            nextPiece = {
                shape: SHAPES[Math.floor(Math.random() * SHAPES.length)],
                color: COLORS[Math.floor(Math.random() * COLORS.length)],
                x: 2,
                y: 2
            };

            if (checkCollision(currentPiece.x, currentPiece.y, currentPiece.shape)) {
                gameOver();
            }
        }

        function update() {
            if (!isPaused) {
                if (!checkCollision(currentPiece.x, currentPiece.y + 1, currentPiece.shape)) {
                    currentPiece.y++;
                } else {
                    lockPiece();
                    clearLines();
                    createNewPiece();
                }
                draw();
            }
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawPiece(currentPiece.x, currentPiece.y, currentPiece.shape, currentPiece.color);
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (board[y][x]) {
                        ctx.fillStyle = board[y][x];
                        ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE-1, BLOCK_SIZE-1);
                    }
                }
            }
        }

        function drawNextPiece() {
            nextCtx.fillStyle = '#333';
            nextCtx.fillRect(0, 0, nextPieceCanvas.width, nextPieceCanvas.height);
            const offsetX = (nextPieceCanvas.width - nextPiece.shape[0].length * BLOCK_SIZE/2)/2;
            const offsetY = (nextPieceCanvas.height - nextPiece.shape.length * BLOCK_SIZE/2)/2;
            for (let y = 0; y < nextPiece.shape.length; y++) {
                for (let x = 0; x < nextPiece.shape[y].length; x++) {
                    if (nextPiece.shape[y][x]) {
                        nextCtx.fillStyle = nextPiece.color;
                        nextCtx.fillRect(offsetX + x * BLOCK_SIZE/2, offsetY + y * BLOCK_SIZE/2, BLOCK_SIZE/2-1, BLOCK_SIZE/2-1);
                    }
                }
            }
        }

        function checkCollision(x, y, shape) {
            for (let row = 0; row < shape.length; row++) {
                for (let col = 0; col < shape[row].length; col++) {
                    if (shape[row][col]) {
                        let newX = x + col;
                        let newY = y + row;
                        if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
                        if (newY >= 0 && board[newY][newX]) return true;
                    }
                }
            }
            return false;
        }

        function lockPiece() {
            for (let row = 0; row < currentPiece.shape.length; row++) {
                for (let col = 0; col < currentPiece.shape[row].length; col++) {
                    if (currentPiece.shape[row][col]) {
                        let y = currentPiece.y + row;
                        if (y < 0) return gameOver();
                        board[y][currentPiece.x + col] = currentPiece.color;
                    }
                }
            }
        }

        function clearLines() {
            let linesCleared = 0;
            for (let row = ROWS - 1; row >= 0; row--) {
                if (board[row].every(cell => cell)) {
                    board.splice(row, 1);
                    board.unshift(Array(COLS).fill(0));
                    linesCleared++;
                    row++;
                }
            }
            if (linesCleared > 0) {
                score += [100, 300, 500, 800][linesCleared - 1] || 0;
                scoreElement.textContent = score;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('tetrisHighScore', highScore);
                    highScoreElement.textContent = highScore;
                }
            }
        }

        function gameOver() {
            clearInterval(gameLoop);
            alert(`游戏结束！得分：${score}`);
            board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
            score = 0;
            scoreElement.textContent = score;
            initGame();
        }

        document.addEventListener('keydown', (e) => {
            if (!isPaused) {
                switch(e.keyCode) {
                    case 37: if (!checkCollision(currentPiece.x - 1, currentPiece.y, currentPiece.shape)) currentPiece.x--; break;
                    case 39: if (!checkCollision(currentPiece.x + 1, currentPiece.y, currentPiece.shape)) currentPiece.x++; break;
                    case 40: if (!checkCollision(currentPiece.x, currentPiece.y + 1, currentPiece.shape)) currentPiece.y++; break;
                    case 38: const rotated = rotatePiece(currentPiece.shape); if (!checkCollision(currentPiece.x, currentPiece.y, rotated)) currentPiece.shape = rotated; break;
                    case 32: while (!checkCollision(currentPiece.x, currentPiece.y + 1, currentPiece.shape)) currentPiece.y++; break;
                }
                draw();
            }
        });

        function rotatePiece(shape) {
            const newShape = [];
            for (let col = 0; col < shape[0].length; col++) {
                newShape[col] = [];
                for (let row = shape.length - 1; row >= 0; row--) {
                    newShape[col].push(shape[row][col]);
                }
            }
            return newShape;
        }

        function drawPiece(x, y, shape, color) {
            ctx.fillStyle = color;
            for (let row = 0; row < shape.length; row++) {
                for (let col = 0; col < shape[row].length; col++) {
                    if (shape[row][col]) {
                        ctx.fillRect((x + col) * BLOCK_SIZE, (y + row) * BLOCK_SIZE, BLOCK_SIZE - 1, BLOCK_SIZE - 1);
                    }
                }
            }
        }

        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? '继续游戏' : '暂停';
        });

        restartBtn.addEventListener('click', () => {
            clearInterval(gameLoop);
            board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
            score = 0;
            scoreElement.textContent = score;
            isPaused = false;
            pauseBtn.textContent = '暂停/继续';
            initGame();
        });

        initGame();
    </script>
</body>
</html>
