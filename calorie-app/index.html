<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食物熱量辨識</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .container {
    background: white;
    border-radius: 20px;
    padding: 40px;
    max-width: 600px;
    width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
  }
  h1 {
    text-align: center;
    color: #2d3436;
    font-size: 28px;
    margin-bottom: 8px;
  }
  .subtitle {
    text-align: center;
    color: #636e72;
    margin-bottom: 30px;
    font-size: 14px;
  }
  .api-key-section {
    background: #f8f9fa;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 24px;
  }
  .api-key-section label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #2d3436;
    margin-bottom: 8px;
  }
  .api-key-row {
    display: flex;
    gap: 8px;
  }
  .api-key-row input {
    flex: 1;
    padding: 10px 14px;
    border: 2px solid #dfe6e9;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .api-key-row input:focus { border-color: #00b894; }
  .api-key-row button {
    padding: 10px 16px;
    background: #00b894;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    transition: background 0.2s;
  }
  .api-key-row button:hover { background: #00a381; }
  .api-key-row button.secondary {
    background: #b2bec3;
  }
  .api-key-row button.secondary:hover { background: #9ca5ad; }
  .api-status {
    font-size: 12px;
    margin-top: 6px;
    color: #636e72;
  }
  .api-status.ok { color: #00b894; }
  .upload-area {
    border: 2px dashed #dfe6e9;
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    margin-bottom: 20px;
    position: relative;
  }
  .upload-area:hover, .upload-area.dragover {
    border-color: #00b894;
    background: #f0fff8;
  }
  .upload-area.has-image {
    border-style: solid;
    padding: 12px;
  }
  .upload-icon {
    font-size: 48px;
    margin-bottom: 12px;
  }
  .upload-text {
    color: #636e72;
    font-size: 15px;
  }
  .upload-hint {
    color: #b2bec3;
    font-size: 13px;
    margin-top: 4px;
  }
  .upload-area input[type="file"] {
    display: none;
  }
  #preview {
    max-width: 100%;
    max-height: 350px;
    border-radius: 8px;
    display: none;
  }
  .remove-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    background: rgba(0,0,0,0.5);
    color: white;
    border: none;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    cursor: pointer;
    font-size: 18px;
    display: none;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .remove-btn:hover { background: rgba(0,0,0,0.7); }
  .analyze-btn {
    width: 100%;
    padding: 14px;
    background: #00b894;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    margin-bottom: 20px;
  }
  .analyze-btn:hover { background: #00a381; }
  .analyze-btn:disabled {
    background: #b2bec3;
    cursor: not-allowed;
  }
  .result {
    border-radius: 12px;
    padding: 20px;
    display: none;
    line-height: 1.8;
    font-size: 15px;
  }
  .result.success {
    background: #f0fff8;
    border: 1px solid #55efc4;
    display: block;
  }
  .result.error {
    background: #fff5f5;
    border: 1px solid #fab1a0;
    display: block;
    color: #d63031;
  }
  .result h3 {
    margin-bottom: 10px;
    font-size: 18px;
  }
  .result.success h3 { color: #00b894; }
  .result .label {
    color: #636e72;
    font-weight: 600;
  }
  .loading {
    text-align: center;
    padding: 20px;
    display: none;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 4px solid #dfe6e9;
    border-top-color: #00b894;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .footer {
    text-align: center;
    color: #b2bec3;
    font-size: 12px;
    margin-top: 24px;
  }
  .footer a { color: #00b894; text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <h1>🥗 食物熱量辨識</h1>
  <p class="subtitle">上傳照片，AI 幫你估算熱量！</p>

  <!-- API Key -->
  <div class="api-key-section">
    <label>🔑 DeepInfra (DeepSeek Vision) API Key</label>
    <div class="api-key-row">
      <input type="password" id="apiKey" placeholder="輸入你的 DeepInfra (DeepSeek Vision) API Key">
      <button onclick="saveKey()">儲存</button>
      <button class="secondary" onclick="clearKey()">清除</button>
    </div>
    <div class="api-status" id="apiStatus">API Key 只存在你本機瀏覽器，不會上傳到伺服器</div>
  </div>

  <!-- Upload -->
  <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
    <div class="upload-icon">📸</div>
    <div class="upload-text">點擊此處上傳照片</div>
    <div class="upload-hint">或拖曳圖片到這裡</div>
    <img id="preview" alt="預覽">
    <button class="remove-btn" id="removeBtn" onclick="event.stopPropagation(); removeImage()">✕</button>
    <input type="file" id="fileInput" accept="image/*" onchange="handleFile(this.files[0])">
  </div>

  <button class="analyze-btn" id="analyzeBtn" onclick="analyze()" disabled>🔍 分析熱量</button>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div style="color:#636e72; font-size:14px;">AI 分析中...</div>
  </div>

  <div class="result" id="result"></div>
  <div class="footer">
    熱量為 AI 估算值，僅供參考 &nbsp;|&nbsp; 使用 <a href="https://deepinfra.com" target="_blank">DeepInfra + DeepSeek Vision</a>
  </div>
</div>

<script>
const API_BASE = 'https://api.deepinfra.com/v1/openai/chat/completions';

document.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('deepinfra_api_key');
  if (saved) {
    document.getElementById('apiKey').value = saved;
    document.getElementById('apiStatus').textContent = '✅ API Key 已載入';
    document.getElementById('apiStatus').className = 'api-status ok';
  }
});

function saveKey() {
  const key = document.getElementById('apiKey').value.trim();
  if (!key) return alert('請輸入 API Key');
  localStorage.setItem('deepinfra_api_key', key);
  document.getElementById('apiStatus').textContent = '✅ API Key 已儲存（僅存在本機）';
  document.getElementById('apiStatus').className = 'api-status ok';
}

function clearKey() {
  localStorage.removeItem('deepinfra_api_key');
  document.getElementById('apiKey').value = '';
  document.getElementById('apiStatus').textContent = 'API Key 已清除';
  document.getElementById('apiStatus').className = 'api-status';
}

const uploadArea = document.getElementById('uploadArea');
uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
uploadArea.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadArea.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) handleFile(file);
});

let currentFile = null;

function handleFile(file) {
  if (!file) return;
  currentFile = file;
  const reader = new FileReader();
  reader.onload = (e) => {
    const preview = document.getElementById('preview');
    preview.src = e.target.result;
    preview.style.display = 'block';
    uploadArea.classList.add('has-image');
    document.querySelector('.upload-icon').style.display = 'none';
    document.querySelector('.upload-text').style.display = 'none';
    document.querySelector('.upload-hint').style.display = 'none';
    document.getElementById('removeBtn').style.display = 'flex';
    document.getElementById('analyzeBtn').disabled = false;
  };
  reader.readAsDataURL(file);
}

function removeImage() {
  currentFile = null;
  document.getElementById('preview').style.display = 'none';
  document.getElementById('preview').src = '';
  document.getElementById('fileInput').value = '';
  uploadArea.classList.remove('has-image');
  document.querySelector('.upload-icon').style.display = 'block';
  document.querySelector('.upload-text').style.display = 'block';
  document.querySelector('.upload-hint').style.display = 'block';
  document.getElementById('removeBtn').style.display = 'none';
  document.getElementById('analyzeBtn').disabled = true;
  document.getElementById('result').style.display = 'none';
}

async function analyze() {
  const key = document.getElementById('apiKey').value.trim() || localStorage.getItem('deepinfra_api_key');
  if (!key) return alert('請先輸入並儲存 DeepInfra (DeepSeek Vision) API Key');
  if (!currentFile) return alert('請先上傳照片');

  document.getElementById('analyzeBtn').disabled = true;
  document.getElementById('loading').style.display = 'block';
  document.getElementById('result').style.display = 'none';

  try {
    const base64 = await fileToBase64(currentFile);
    const mimeType = currentFile.type;

    const response = await fetch(API_BASE, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${key}`
      },
      body: JSON.stringify({
        model: 'deepseek-ai/Janus-Pro-7B',
        messages: [{
          role: 'user',
          content: [
            { type: 'text', text: '你是一個專業的營養分析師。請分析圖片中的內容：\n\n1. 如果圖片中是食物或飲料，請回覆：\n   - 食物名稱\n   - 估算的熱量（大卡）\n   - 主要營養成分（蛋白質、脂肪、碳水化合物）\n   - 份量建議\n\n2. 如果圖片中不是食物，請只回覆「這個不是食物」\n\n請用繁體中文回覆。' },
            { type: 'image_url', image_url: { url: `data:${mimeType};base64,${base64}` } }
          ]
        }]
      })
    });

    const data = await response.json();
    if (data.error) throw new Error(data.error.message);

    const text = data.choices?.[0]?.message?.content || '無法取得分析結果';
    const isNotFood = text.includes('這個不是食物');

    const resultDiv = document.getElementById('result');
    resultDiv.className = `result ${isNotFood ? 'error' : 'success'}`;
    resultDiv.innerHTML = isNotFood
      ? `<h3>🚫 這個不是食物</h3><p>${text}</p>`
      : `<h3>📊 分析結果</h3><div>${text.replace(/\n/g, '<br>')}</div>`;
    resultDiv.style.display = 'block';

  } catch (err) {
    const resultDiv = document.getElementById('result');
    resultDiv.className = 'result error';
    resultDiv.innerHTML = `<h3>❌ 錯誤</h3><p>${err.message}</p>`;
    resultDiv.style.display = 'block';
  } finally {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('analyzeBtn').disabled = false;
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
</script>
</body>
</html>
